<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0b2e">
  <title>Расписание колледжа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{--bg:#1a0b2e;--bg2:#2d1b4e;--pink:#ff3366;--violet:#b829dd;--indigo:#6c5ce7;--white:#fff;--muted:#a8a8c9;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.1)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 85% 0%,rgba(184,41,221,.27),transparent 38%),radial-gradient(circle at -5% 70%,rgba(255,51,102,.14),transparent 34%),linear-gradient(135deg,var(--bg),var(--bg2));pointer-events:none}
    body:after{content:"";position:fixed;width:240px;height:240px;right:-110px;bottom:8%;border-radius:50%;background:rgba(108,92,231,.16);filter:blur(50px);z-index:-1}
    button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0} .app{width:min(100%,480px);min-height:100vh;margin:auto;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}.screen{display:none;animation:in .28s ease}.screen.active{display:block}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    h1{font-size:24px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.6px}h2{font-size:18px;margin:0}.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px}.topbar h1{font-size:20px;text-align:center;flex:1}.icon-btn,.back-btn{height:56px;min-width:56px;border-radius:17px;background:var(--glass);border:1px solid var(--line);font-size:21px;transition:.3s}.icon-btn:hover,.back-btn:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}.back-btn{padding:0 15px;font-size:14px;white-space:nowrap}
    .glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 0 30px rgba(184,41,221,.08);border-radius:28px}.welcome{padding-top:24vh;text-align:center}.brand-mark{display:inline-flex;width:76px;height:76px;align-items:center;justify-content:center;border-radius:26px;margin-bottom:20px;font-size:36px;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 0 36px rgba(184,41,221,.4)}.welcome h1{font-size:30px}.welcome p{color:var(--muted);font-size:13px;margin:12px 0 28px}.field{height:56px;width:100%;padding:0 18px;border:1px solid var(--line);border-radius:18px;outline:0;background:rgba(0,0,0,.16);color:var(--white);transition:.3s}.field::placeholder{color:var(--muted)}.field:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,51,102,.13)}select.field{appearance:none;background-color:rgba(255,255,255,.08)}option{background:#281841;color:white}.input-wrap{position:relative}.suggestions{position:absolute;z-index:5;left:0;right:0;bottom:calc(100% + 10px);max-height:210px;overflow:auto;padding:8px;border-radius:22px;background:rgba(38,19,68,.98);border:1px solid var(--line);box-shadow:0 12px 32px #11071e}.suggestions:empty{display:none}.suggestion{display:block;width:100%;height:46px;padding:0 14px;border-radius:13px;background:transparent;text-align:left}.suggestion:hover{background:rgba(255,255,255,.1)}.small-note{font-size:11px;color:var(--muted);text-align:center}.error{display:none;margin:12px 0;padding:13px 15px;border-radius:17px;background:rgba(255,51,102,.14);border:1px solid rgba(255,51,102,.3);font-size:12px;color:#ffd6e0}.error.show{display:block}
    .group-name{text-align:center;color:var(--muted);font-size:12px;margin:5px 0 16px}.swiper{width:calc(100% + 32px);margin-left:-16px;padding:18px 0 25px}.swiper-slide{width:82px;height:58px!important;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:21px;color:rgba(255,255,255,.4);font-weight:700;font-size:13px;transform:scale(.78);transition:.3s;user-select:none}.swiper-slide-active{color:white;transform:scale(1.18);border-color:var(--pink);background:linear-gradient(135deg,rgba(255,51,102,.23),rgba(184,41,221,.27));box-shadow:0 0 25px rgba(255,51,102,.33)}.swiper-slide-prev,.swiper-slide-next{color:rgba(255,255,255,.65);transform:scale(.9)}.swiper-pagination-bullet{background:#fff;opacity:.25}.swiper-pagination-bullet-active{opacity:1;background:var(--pink)}
    .status{display:flex;align-items:center;justify-content:center;min-height:48px;margin:0 0 14px;padding:10px 15px;border-radius:18px;background:rgba(255,255,255,.06);font-size:13px;color:var(--muted);text-align:center}.status.going{color:#ff809e;background:linear-gradient(100deg,rgba(255,51,102,.2),rgba(184,41,221,.16));border:1px solid rgba(255,51,102,.35)}.status.soon{color:#ffcc75;background:rgba(184,41,221,.15);border:1px solid rgba(184,41,221,.3)}
    .schedule-list{display:grid;gap:12px}.lesson{position:relative;display:grid;grid-template-columns:92px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:94px;padding:15px 13px;border-radius:25px;background:rgba(255,255,255,.075);border:1px solid var(--line);backdrop-filter:blur(20px);transition:.3s}.lesson.current{background:linear-gradient(115deg,rgba(255,51,102,.3),rgba(184,41,221,.27));border-color:var(--pink);box-shadow:0 0 25px rgba(255,51,102,.2);animation:pulse 2.2s infinite}.lesson.current:before{content:"";position:absolute;inset:-1px;border-radius:25px;border:1px solid var(--pink);animation:glow 2.2s infinite;pointer-events:none}@keyframes pulse{50%{transform:translateY(-2px)}}@keyframes glow{50%{opacity:.35;box-shadow:0 0 22px rgba(255,51,102,.5)}}.pair-num{font-weight:700;font-size:13px;margin-bottom:6px}.pair-time{font-size:10px;line-height:1.55;color:var(--muted);white-space:nowrap}.subject{font-weight:700;font-size:15px;line-height:1.3;overflow-wrap:anywhere}.room{padding:8px 9px;border-radius:11px;background:linear-gradient(135deg,var(--indigo),var(--violet));font-weight:700;font-size:12px;white-space:nowrap;box-shadow:0 5px 14px rgba(108,92,231,.24)}.empty{padding:40px 15px;text-align:center;color:var(--muted);font-size:14px}.updated{display:block;text-align:center;color:var(--muted);font-size:11px;margin-top:17px}.loader{width:23px;height:23px;margin:30px auto;border-radius:50%;border:2px solid rgba(255,255,255,.18);border-top-color:var(--pink);animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .search-head{display:flex;align-items:center;justify-content:space-between;margin:13px 0 22px}.search-head h1{font-size:28px}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:5px;margin-bottom:14px;border-radius:19px;background:rgba(0,0,0,.14);border:1px solid var(--line)}.tab{height:48px;border-radius:15px;background:transparent;color:var(--muted);font-size:11px;font-weight:600;padding:0 3px}.tab.active{color:#fff;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 5px 15px rgba(184,41,221,.28)}.search-panel{padding:18px;border-radius:26px}.panel-title{margin:0 0 14px;font-size:15px;font-weight:700}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;height:56px;margin-top:12px;border-radius:18px;background:linear-gradient(135deg,var(--pink),var(--violet));font-weight:700;box-shadow:0 8px 22px rgba(184,41,221,.25);transition:.3s}.primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,51,102,.3)}.results{margin-top:14px}.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.room-result{padding:13px 4px;text-align:center;border-radius:15px;background:rgba(108,92,231,.25);border:1px solid rgba(108,92,231,.35);font-weight:700}.table-wrap{overflow:auto;border-radius:18px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:11px;min-width:420px}th,td{padding:12px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:500;background:rgba(0,0,0,.12)}tr:last-child td{border-bottom:0}.dev{padding:55px 12px;text-align:center;color:var(--muted)}.dev-icon{display:block;font-size:42px;margin-bottom:15px;filter:drop-shadow(0 0 15px rgba(184,41,221,.5))}.footer-space{height:12px}
    @media(max-width:370px){.app{padding-left:12px;padding-right:12px}.lesson{grid-template-columns:83px minmax(0,1fr) auto;padding-left:10px;padding-right:10px}.pair-time{font-size:9px}.subject{font-size:14px}.room{font-size:11px;padding:7px}.swiper{width:calc(100% + 24px);margin-left:-12px}.tab{font-size:10px}}

    /* Static magnifying-frame day picker */
    .day-picker{position:relative;margin:35px -16px 0;height:86px}
    .day-frame{position:absolute;z-index:3;left:50%;top:50%;width:120px;height:60px;transform:translate(-50%,-50%);border:2px solid var(--pink);border-radius:20px;box-shadow:0 0 25px rgba(255,51,102,.4);pointer-events:none}
    .day-scroll{display:flex;align-items:center;height:86px;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:0 calc((100% - 120px)/2);scrollbar-width:none}
    .day-scroll::-webkit-scrollbar{display:none}.day-item{scroll-snap-align:center;flex:0 0 120px;height:60px;display:flex;align-items:center;justify-content:center;padding:15px 25px;font-size:14px;opacity:.4;font-weight:500;transition:all .3s;z-index:1;cursor:pointer}.day-item.active{opacity:1;font-size:20px;font-weight:700;color:#fff}
    .schedule-list{gap:20px;margin-top:25px}.lesson{grid-template-columns:90px minmax(0,1fr) 70px;gap:15px;min-height:125px;padding:25px}.lesson-time{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.45;color:var(--muted)}.lesson-time strong{font-size:14px;color:#fff;margin-bottom:5px}.lesson-time span{display:block}.lesson-subject{display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;text-align:center}.lesson-room{display:flex;align-items:center;justify-content:center}.room-badge{background:linear-gradient(135deg,var(--violet),var(--indigo));padding:8px 14px;border-radius:12px;font-size:14px;font-weight:600}.status{margin-bottom:0}.search-panel{margin-top:40px}.panel-description{margin:-6px 0 18px;color:var(--muted);font-size:12px;line-height:1.5}.optional{font-size:11px;color:var(--muted);margin:10px 0 -4px}.controls.three{grid-template-columns:1fr 1fr 1fr}.search-panel .field{margin-bottom:10px}.search-panel .controls .field{margin-bottom:0}
    @media(max-width:370px){.day-scroll{gap:12px}.lesson{grid-template-columns:80px minmax(0,1fr) 60px;gap:10px;padding:20px}.controls.three{grid-template-columns:1fr 1fr}.controls.three .room-filter{grid-column:1/-1}.day-item{flex-basis:120px}}
  </style>
</head>
<body>
<main class="app">
  <section id="screen-group" class="screen">
    <div class="welcome"><div class="brand-mark" aria-hidden="true">Р</div><h1>Расписание</h1><p>Выберите группу, чтобы увидеть пары на сегодня</p>
      <div class="input-wrap"><input id="group-input" class="field" autocomplete="off" placeholder="Введите группу..." aria-label="Группа"><div id="group-suggestions" class="suggestions"></div></div>
      <p class="small-note">Можно начать вводить название группы</p><div id="group-error" class="error"></div>
    </div>
  </section>
  <section id="screen-schedule" class="screen">
    <div class="topbar"><button id="change-group" class="back-btn">← Группа</button><h1>Расписание</h1><button id="open-search" class="icon-btn" aria-label="Поиск">⌕</button></div>
    <div id="group-name" class="group-name"></div>
    <div class="day-picker"><div class="day-frame" aria-hidden="true"></div><div id="day-slides" class="day-scroll" aria-label="Выбор дня"></div></div>
    <div id="pair-status" class="status">Пар нет</div><div id="schedule-error" class="error"></div><div id="schedule-loader" class="loader" hidden></div><div id="schedule-list" class="schedule-list"></div><span id="updated" class="updated">Обновлено: —</span>
  </section>
  <section id="screen-search" class="screen">
    <div class="search-head"><h1>Поиск</h1><button id="close-search" class="icon-btn" aria-label="Назад">←</button></div>
    <div class="tabs"><button class="tab active" data-tab="rooms">Аудитории</button><button class="tab" data-tab="subjects">Предметы</button><button class="tab" data-tab="teachers">Преподаватели</button></div>
    <div id="search-panel" class="search-panel glass"></div><div id="search-error" class="error"></div>
  </section>
</main>
<script>
const API='/api',DAYS=['ПН','ВТ','СР','ЧТ','ПТ','СБ'],TYPES={ПН:'monday',ВТ:'weekday',СР:'weekday',ЧТ:'weekday',ПТ:'weekday',СБ:'saturday'};
let groups=[],selectedDay='ПН',schedule=[],times={},swiper;
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function screen(n){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('screen-'+n).classList.add('active')}
function error(id,text){$(id).textContent=text||'';$(id).classList.toggle('show',!!text)}
async function get(path){const r=await fetch(API+path);if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
function today(){const n=new Date().getDay();return n>0&&n<7?DAYS[n-1]:null}
function telegram(){try{if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}}catch(e){}}
async function loadGroups(){try{const d=await get('/groups');groups=d.groups||[]}catch(e){error('group-error','Не удалось загрузить список групп. Проверьте соединение.')}}
function suggestions(){const q=$('group-input').value.toLowerCase().trim();$('group-suggestions').innerHTML=groups.filter(x=>x.toLowerCase().includes(q)).slice(0,80).map(x=>`<button class="suggestion" data-group="${esc(x)}">${esc(x)}</button>`).join('')}
function choose(g){localStorage.setItem('selectedGroup',g);$('group-suggestions').innerHTML='';openSchedule()}
function setupDays(){const initial=today()||'ПН';selectedDay=initial;$('day-slides').innerHTML=DAYS.map(d=>`<button class="day-item ${d===initial?'active':''}" data-day="${d}" type="button">${d}</button>`).join('');const scroll=$('day-slides');requestAnimationFrame(()=>{const item=scroll.querySelector(`[data-day="${initial}"]`);item?.scrollIntoView({behavior:'instant',block:'nearest',inline:'center'})});scroll.addEventListener('click',e=>{const item=e.target.closest('.day-item');if(item)item.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})});scroll.addEventListener('scroll',()=>{clearTimeout(scroll._snapTimer);scroll._snapTimer=setTimeout(()=>{const center=scroll.getBoundingClientRect().left+scroll.clientWidth/2;let nearest=null,distance=Infinity;scroll.querySelectorAll('.day-item').forEach(item=>{const box=item.getBoundingClientRect(),d=Math.abs(box.left+box.width/2-center);if(d<distance){distance=d;nearest=item}});if(nearest){const d=nearest.dataset.day;scroll.querySelectorAll('.day-item').forEach(x=>x.classList.toggle('active',x===nearest));if(d!==selectedDay){selectedDay=d;loadSchedule()}}},90)}, {passive:true})}

async function openSchedule(){const g=localStorage.getItem('selectedGroup');if(!g){screen('group');return}$('group-name').textContent=g;screen('schedule');setupDays();loadSchedule()}
function pairLabel(pair){return Number(pair)===0?'1':String(pair)}
function fullTime(pair){const list=times[String(pair)]||[];return list.map(x=>`${esc(x.start)}–${esc(x.end)}`).join(' | ')||'Время не указано'}
function render(){if(!schedule.length){$('schedule-list').innerHTML='<div class="empty glass">На этот день пар нет</div>';return}$('schedule-list').innerHTML=schedule.map(x=>`<article class="lesson" data-pair="${esc(x.pair)}"><div class="lesson-time"><strong>${esc(pairLabel(x.pair))} пара</strong>${(times[String(x.pair)]||[]).map(t=>`<span>${esc(t.start)}-${esc(t.end)}</span>`).join('')||'<span>Время не указано</span>'}</div><div class="lesson-subject">${esc(x.subject)}</div><div class="lesson-room"><span class="room-badge">${esc(x.room||'—')}</span></div></article>`).join('')}
function mins(v){const p=String(v).split(':').map(Number);return p[0]*60+p[1]}
function status(){const now=new Date().getHours()*60+new Date().getMinutes(),s=$('pair-status');s.className='status';s.textContent=selectedDay===today()?'Пар на сегодня нет':'Сегодня пар нет';document.querySelectorAll('.lesson').forEach(x=>x.classList.remove('current'));if(selectedDay!==today()){if(!today())s.textContent='Сегодня выходной';return;}let active=null,next=null;Object.entries(times).forEach(([p,a])=>{(a||[]).forEach(t=>{const st=mins(t.start),en=mins(t.end);if(now>=st&&now<en)active={p,en};else if(st>now&&(!next||st<next.st))next={st}})});if(active){s.classList.add('going');s.textContent=`Идёт ${pairLabel(active.p)}-я пара · осталось ${active.en-now} мин`;document.querySelectorAll(`[data-pair="${CSS.escape(active.p)}"]`).forEach(x=>x.classList.add('current'))}else if(next){s.classList.add('soon');s.textContent=`Следующая пара через ${next.st-now} мин`}else{s.textContent='На данный момент пар нет'}}
async function loadSchedule(){const g=localStorage.getItem('selectedGroup');$('schedule-loader').hidden=false;$('schedule-list').innerHTML='';error('schedule-error','');try{const [a,b]=await Promise.all([get('/schedule?group='+encodeURIComponent(g)+'&day='+encodeURIComponent(selectedDay)).catch(e=>e.message.includes('404')?{lessons:[]}:Promise.reject(e)),get('/pair_times?day_type='+TYPES[selectedDay])]);schedule=a.lessons||[];times=b.times||{};render();status()}catch(e){$('schedule-list').innerHTML='<div class="empty glass">Не удалось загрузить расписание</div>';error('schedule-error','Ошибка загрузки. Попробуйте ещё раз.')}finally{$('schedule-loader').hidden=true;updateTime()}}
async function updateTime(){try{const d=await get('/last_update');$('updated').textContent='Обновлено: '+(d.updated_between||d.message||'—')}catch(e){$('updated').textContent='Обновление недоступно'}}
function roomsPanel(){return `<p class="panel-title">Свободные аудитории</p><p class="panel-description">Показывает свободные кабинеты в указанное время</p><div class="controls"><select id="room-day" class="field">${DAYS.map(d=>`<option ${d===selectedDay?'selected':''}>${d}</option>`).join('')}</select><select id="room-pair" class="field">${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n} пара</option>`).join('')}</select></div><button id="find-rooms" class="primary">Найти свободные кабинеты</button><div id="results" class="results"></div>`}
function subjectsPanel(){return `<p class="panel-title">Поиск групп по предмету</p><p class="panel-description">Показывает все группы, у которых есть указанный предмет в выбранный день</p><input id="subject" class="field" placeholder="Например, Математика"><div class="controls three"><select id="subject-day" class="field">${DAYS.map(d=>`<option ${d===selectedDay?'selected':''}>${d}</option>`).join('')}</select><select id="subject-pair" class="field"><option value="">Любая пара</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n} пара</option>`).join('')}</select><input id="subject-room" class="field room-filter" placeholder="Кабинет (необязательно)"></div><button id="find-subject" class="primary">Найти группы</button><div id="results" class="results"></div>`}
function teachersPanel(){return '<div class="dev"><span class="dev-icon">—</span><strong>Преподаватели</strong><br><br>Поиск расписания преподавателей (в разработке)</div>'}
function renderPanel(type){$('search-panel').innerHTML=type==='rooms'?roomsPanel():type==='subjects'?subjectsPanel():teachersPanel();if(type==='rooms')$('find-rooms').onclick=findRooms;if(type==='subjects')$('find-subject').onclick=findSubjects}
async function findRooms(){const o=$('results');o.innerHTML='<div class="loader"></div>';try{const d=await get('/free_rooms?day='+encodeURIComponent($('room-day').value)+'&pair='+$('room-pair').value);o.innerHTML=d.free_rooms?.length?'<div class="rooms">'+d.free_rooms.map(x=>`<div class="room-result">${esc(x)}</div>`).join('')+'</div>':'<div class="empty">Свободных кабинетов нет</div>'}catch(e){o.innerHTML='<div class="empty">Не удалось найти кабинеты</div>'}}
async function findSubjects(){const value=$('subject').value.trim(),o=$('results');const day=$('subject-day').value,pair=$('subject-pair').value,room=$('subject-room').value.trim();if(!value)return;o.innerHTML='<div class="loader"></div>';try{const d=await get('/combined_classes?subject='+encodeURIComponent(value)+'&day_week='+encodeURIComponent(day)+(pair?'&pair_num='+encodeURIComponent(pair):'')+(room?'&room='+encodeURIComponent(room):''));o.innerHTML=d.groups?.length?`<div class="table-wrap"><table><thead><tr><th>Группа</th><th>День</th><th>Пара</th><th>Предмет</th><th>Кабинет</th></tr></thead><tbody>${d.groups.map(x=>`<tr><td>${esc(x.group_name)}</td><td>${esc(x.day_of_week)}</td><td>${esc(pairLabel(x.pair_number))}</td><td>${esc(x.subject)}</td><td>${esc(x.room)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Ничего не найдено</div>'}catch(e){o.innerHTML='<div class="empty">Не удалось выполнить поиск</div>'}}
$('group-input').oninput=suggestions;$('group-input').onfocus=suggestions;$('group-suggestions').onclick=e=>{const x=e.target.closest('[data-group]');if(x)choose(x.dataset.group)};$('change-group').onclick=()=>{localStorage.removeItem('selectedGroup');$('group-input').value='';screen('group');loadGroups()};$('open-search').onclick=()=>{screen('search');renderPanel('rooms')};$('close-search').onclick=()=>screen('schedule');document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');renderPanel(t.dataset.tab)});setInterval(status,30000);
(async function(){telegram();if(localStorage.getItem('selectedGroup'))openSchedule();else{screen('group');await loadGroups()}})();
</script>
